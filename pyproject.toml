[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietdub"
version = "0.1.0"
description = "Windows-first CLI for Chinese-to-Vietnamese cartoon dubbing"
requires-python = ">=3.11"
# Hybrid pinning — see docs/superpowers/specs/2026-06-29-numpy-stack-upgrade-design.md
# Bounded compatibility ranges (both floor and ceiling).
# Ceilings prevent drift into known-broken versions.
dependencies = [
  # Core
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.1",
  "anthropic>=0.40.0",
  "httpx>=0.27.0",
  "pydub>=0.25.1",
  "faster-whisper>=1.0.3",
  # ML stack (upgraded from NumPy 1.x era)
  "numpy>=2.0,<2.4",
  "torch>=2.6,<3",
  "paddlepaddle>=3.0,<4",
  "paddleocr>=3.0",
  "onnxruntime>=1.18,<1.20",
  "protobuf>=4.25,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
vietdub = "vietdub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
