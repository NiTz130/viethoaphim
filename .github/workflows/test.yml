name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress
      - name: Setup (Linux)
        if: runner.os != 'Windows'
        run: make setup
      - name: Setup (Windows)
        if: runner.os == 'Windows'
        run: .\setup.ps1
      - name: Test
        run: make test
        shell: bash
