name: ocr-diff
on:
  pull_request:
    paths:
      - 'src/vietdub/ocr/**'
      - 'requirements.txt'
      - 'requirements-2026.txt'
jobs:
  ocr-diff:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: win-pip-${{ hashFiles('requirements.txt') }}
      - run: .\setup.ps1
      - name: OCR diff
        run: make ocr-diff
        shell: bash
